<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer Configurator</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #1e1e1e;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #2a2a2a;
            padding: 2em;
            border-radius: 8px;
            box-shadow: 0px 4px 8px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #ff8c00;
            font-size: 1.5em;
        }

        label {
            display: block;
            margin: 0.5em 0;
            color: #ff8c00;
        }

        input[type="text"],
        input[type="datetime-local"],
        input[type="color"],
        select,
        button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 4px;
            margin-top: 5px;
            font-size: 1em;
            box-sizing: border-box;
        }
        
        input[type="color"] {
            padding: 0;
            height: 50px;
            border: 2px solid #3c3c3c;
            cursor: pointer;
            box-sizing: border-box;
        }
        
        select {
            background-color: #3c3c3c;
            color: white;
        }
        
        input[type="text"],
        input[type="datetime-local"],
        input[type="color"] {
            background-color: #3c3c3c;
            color: white;
        }
        
        button {
            background-color: #ff8c00;
            color: white;
            margin-top: 1.5em;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #e67e00;
        }

        .output-link {
            margin-top: 1em;
            text-align: center;
        }

        .output-link a {
            color: #ff8c00;
            text-decoration: none;
            font-weight: bold;
        }

        .output-link a:hover {
            color: #e67e00;
        }
    </style>

    <link id="googleFontLink" rel="stylesheet" href="">
</head>
<body>

<div class="container">
    <h1>Configure Countdown Timer</h1>
    <form id="timerForm">
        <label for="targetTime">Select Date and Time:</label>
        <input type="datetime-local" id="targetTime" name="targetTime" required>

        <label for="timezone">Select Timezone:</label>
        <select id="timezone" name="timezone" required>
            <!-- Timezone options populated via JavaScript -->
        </select>

        <label for="title">Title Text:</label>
        <input type="text" id="title" name="title" value="Title">
        
        <label for="endText">End Text:</label>
        <input type="text" id="endText" name="endText" value="TIME'S UP!">

        <label for="font">Choose Font:</label>
        <select id="font" name="font">
            <option value="Space Mono">Space Mono</option>
        </select>

        <label for="fontColor">Select Font Color:</label>
        <input type="color" id="fontColor" name="fontColor" value="#FFA500">

        <label for="shineEffect">Enable Shine Effect:</label>
        <input type="checkbox" id="shineEffect" name="shineEffect">

        <label for="glitchEffect">Enable Glitch Effect:</label>
        <input type="checkbox" id="glitchEffect" name="glitchEffect">

        <button type="submit">Generate Timer Link</button>
    </form>

    <div class="output-link" id="outputLink"></div>
</div>

<script>
    const googleFontLink = document.getElementById('googleFontLink');

    async function fetchGoogleFonts() {
        try {
            const response = await fetch('https://www.googleapis.com/webfonts/v1/webfonts?key=AIzaSyAbb076hipZ9fgiAdonCNgoX1LU878ODwI&sort=alpha');
            const data = await response.json();
            const fontDropdown = document.getElementById('font');
            
            // Only add the fonts to the dropdown without loading them yet
            data.items.forEach((font) => {
                const option = document.createElement('option');
                option.value = font.family;
                option.textContent = font.family;
                fontDropdown.appendChild(option);
            });
    
            // Set default font on load (adjust 'Space Mono' as needed)
            loadGoogleFont(fontDropdown.value || 'Space Mono');
    
            // Load font only when selected
            fontDropdown.addEventListener('change', function () {
                loadGoogleFont(fontDropdown.value);
            });
        } catch (error) {
            console.error('Error fetching Google Fonts:', error);
        }
    }
    
    function loadGoogleFont(fontName) {
        // Check if the font is already loaded to avoid reloading it
        if (!document.querySelector(`link[href*="${fontName.replace(/ /g, '+')}"]`)) {
            const fontUrl = `https://fonts.googleapis.com/css2?family=${fontName.replace(/ /g, '+')}&display=swap`;
            const fontLink = document.createElement('link');
            fontLink.href = fontUrl;
            fontLink.rel = 'stylesheet';
            document.head.appendChild(fontLink);
        }
    
        // Preview the selected font in the dropdown itself
        const fontDropdown = document.getElementById('font');
        fontDropdown.style.fontFamily = fontName;
    }

    document.addEventListener('DOMContentLoaded', function () {
        const now = new Date();
        const offset = now.getTimezoneOffset() * 60000;
        const localISOTime = new Date(now.getTime() - offset).toISOString().slice(0, -8);
        document.getElementById('targetTime').value = localISOTime;

        populateTimezones();
        setDefaultTimezone();
        fetchGoogleFonts();
    });

    function populateTimezones() {
        const timezoneSelect = document.getElementById('timezone');
        const timezones = Intl.supportedValuesOf('timeZone'); // Automatically get all IANA timezones supported by the browser

        timezones.forEach(tz => {
            const option = document.createElement('option');
            option.value = tz;
            option.textContent = tz;
            timezoneSelect.appendChild(option);
        });
    }

    function setDefaultTimezone() {
        const userTimezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const timezoneSelect = document.getElementById('timezone');

        for (let i = 0; i < timezoneSelect.options.length; i++) {
            if (timezoneSelect.options[i].value === userTimezone) {
                timezoneSelect.selectedIndex = i;
                return;
            }
        }
    }

    document.getElementById('timerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const targetTime = document.getElementById('targetTime').value;
        const timezone = document.getElementById('timezone').value;
        const title = document.getElementById('title').value;
        const endText = document.getElementById('endText').value;
        const font = document.getElementById('font').value;
        const fontColor = document.getElementById('fontColor').value;
        const shineEffect = document.getElementById('shineEffect').checked;
        const glitchEffect = document.getElementById('glitchEffect').checked;

        if (!targetTime) {
            alert('Please select a valid date and time.');
            return;
        }

        const targetDate = new Date(targetTime);
        const isoTarget = targetDate.toISOString();

        const outputLink = `SH2.html?target=${encodeURIComponent(isoTarget)}&timezone=${encodeURIComponent(timezone)}&title=${encodeURIComponent(title)}&endText=${encodeURIComponent(endText)}&font=${encodeURIComponent(font)}&fontColor=${encodeURIComponent(fontColor)}&shineEffect=${shineEffect}&glitchEffect=${glitchEffect}`;
        document.getElementById('outputLink').innerHTML = `<a href="${outputLink}" target="_blank">Open Countdown Timer</a>`;
    });
</script>

</body>
</html>
